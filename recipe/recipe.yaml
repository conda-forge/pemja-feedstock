schema_version: 1

context:
  version: "0.6.3"

package:
  name: pemja
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pemja/pemja-${{ version }}.tar.gz
  sha256: 8425d4ad28fc6deab325dc2a9c9fb3675beae85a27f1bfec0d5667d95f1b4baa

build:
  number: 1
  skip: win
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - openjdk
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
  host:
    - python
    - packaging >=20.5
    - setuptools
    - wheel
    - pip
  run:
    - python
    - find-libpython

tests:
  - python:
      imports:
        - pemja
  - requirements:
      run:
        - pip
    script:
      - pip check

about:
  summary: PemJa is an open source cross language call framework based on FFI. It aims to provide a high-performance framework of calling between different languages.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/alibaba/pemja
  documentation: https://github.com/alibaba/pemja

extra:
  recipe-maintainers:
    - danielnachun
    - gforsyth
    - deepyaman
